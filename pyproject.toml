[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos"
version = "0.1.0"
description = "Local ResearchOS MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "markitdown==0.1.6",
    "pdfminer.six==20251230",
    "pdfplumber==0.11.9",
    "pypdf==6.14.2",
    "python-multipart>=0.0.12,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["researchos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "compose: requires a Docker daemon",
]
